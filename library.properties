name=AlashNTP
version=1.0.1
author=Alash Electronics <alash.electronics@gmail.com>
maintainer=Alash engineering <alash.electronics@gmail.com>
sentence=Easy NTP time library for ESP32 and ESP8266: exact internet time, Kazakhstan time zone by default, non-blocking sync, date and weekday.
paragraph=Gets the exact time from the internet over Wi-Fi with ntp.begin() and ntp.update() in loop(): syncs once an hour without stopping the program, keeps counting between syncs, compensates network delay, checks that the reply is genuine, retries with back-off when the network is gone and gives hour(), day(), year(), weekday(), unixTime() and a text timestamp for any time zone (UTC+5 by default). Explains problems in Russian, Kazakh or English. Needs only the built-in WiFi libraries. Examples included, made for classes and kits by Alash Electronics.
category=Timing
url=https://github.com/Alash-electronics/AlashNTP
architectures=esp32,esp8266
includes=AlashNTP.h
